name: Supabase production deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to deploy pending migrations to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply pending migrations
    if: ${{ inputs.confirmation == 'APPLY' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub environment secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.109.1

      - name: Show CLI version
        run: supabase --version

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Preview pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked \
            --password "${SUPABASE_DB_PASSWORD}"
